[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setforge-pipeline"
version = "0.9.5"
description = "Portable, resumable collection-card production pipeline"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1,<13", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
openai-image = ["openai>=2,<3"]

[project.scripts]
setforge = "setforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
setforge = ["defaults/*.json", "defaults/*.md", "defaults/*.html", "defaults/ui/*.json", "defaults/ui/rating-stars-[1-5].png"]
